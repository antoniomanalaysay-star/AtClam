name: Build and Deploy AtClam

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Dart 3.14 (Flutter 3.50) rejects @JS annotations in camera_web 0.3.5.
          # Pin to a stable release whose Dart SDK (3.11) accepts it.
          flutter-version: '3.41.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --no-wasm-dry-run --dart-define=API_BASE_URL=https://atclam.onrender.com

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Create the Direct Upload project if it does not exist yet.
          # It is safe to ignore the error when the project already exists.
          preCommands: |
            npx wrangler pages project create atclam --production-branch main || true
          command: pages deploy build/web --project-name=atclam --commit-dirty=true
